# Run by hand (Actions → release → Run workflow), after `npx changeset version` is committed on main:
# builds and tests, packs each package, and makes a GitHub Release v<react version> with both tarballs.
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @spawn-ui/tokens && npm run build -w @spawn-ui/react
      - run: npm test -w @spawn-ui/tokens && npm test -w @spawn-ui/react
      - name: pack
        run: |
          mkdir -p out
          npm pack -w @spawn-ui/tokens --pack-destination out
          npm pack -w @spawn-ui/react --pack-destination out
          ls out
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./packages/react/package.json').version")
          T=$(node -p "require('./packages/tokens/package.json').version")
          {
            echo "## @spawn-ui/react $V"; sed -n "/^## $V/,/^## /p" packages/react/CHANGELOG.md | sed '1d;$d'
            echo; echo "## @spawn-ui/tokens $T"; sed -n "/^## $T/,/^## /p" packages/tokens/CHANGELOG.md | sed '1d;$d'
          } > notes.md
          gh release create "v$V" out/*.tgz --title "spawn-ui $V" --notes-file notes.md
